<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#2563eb;--danger:#dc2626;--border:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--primary);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.1rem;margin:0}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--primary);color:#fff;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
button.danger{background:var(--danger)}
button.small{padding:6px 10px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.task h3{margin:0 0 4px}
.task p{margin:0 0 10px;color:var(--muted)}
.badge{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--border)}
.badge.done{background:#bbf7d0;color:#166534}
.badge.in-progress{background:#fef08a;color:#854d0e}
.err{color:var(--danger);min-height:1.2em}
.hidden{display:none}
.filters button{flex:1}
.filters button.active{background:var(--primary);color:#fff}
</style>
</head>
<body>
<header><h1>✅ Task Manager</h1><button id="logout" class="ghost small hidden" style="color:#fff;border-color:#fff">Logout</button></header>
<main>
  <section id="auth" class="card">
    <h2 id="authTitle">Login</h2>
    <input id="name" placeholder="Name" class="hidden">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password (min 6 chars)">
    <div class="err" id="authErr"></div>
    <div class="row"><button id="authBtn">Login</button><button id="toggle" class="ghost">Create account</button></div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <h3 id="hello"></h3>
      <input id="title" placeholder="Task title">
      <textarea id="desc" rows="2" placeholder="Description (optional)"></textarea>
      <select id="status"><option value="todo">To Do</option><option value="in-progress">In Progress</option><option value="done">Done</option></select>
      <div class="err" id="taskErr"></div>
      <button id="addBtn">Add Task</button>
    </div>
    <div class="row filters card" id="filters">
      <button data-f="all" class="ghost active">All</button><button data-f="todo" class="ghost">To Do</button>
      <button data-f="in-progress" class="ghost">Doing</button><button data-f="done" class="ghost">Done</button>
    </div>
    <div id="list"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('token'), userName = localStorage.getItem('name'), isRegister = false, tasks = [], filter = 'all';

async function api(url, method = 'GET', body) {
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...(token && { Authorization: 'Bearer ' + token }) }, body: body && JSON.stringify(body) });
  const data = await res.json();
  if (res.status === 401 && token) logout();
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function show() {
  $('auth').classList.toggle('hidden', !!token);
  $('app').classList.toggle('hidden', !token);
  $('logout').classList.toggle('hidden', !token);
  if (token) { $('hello').textContent = 'Hello, ' + userName + ' 👋'; loadTasks(); }
}
function logout() { token = null; localStorage.clear(); show(); }

$('toggle').onclick = () => {
  isRegister = !isRegister;
  $('name').classList.toggle('hidden', !isRegister);
  $('authTitle').textContent = $('authBtn').textContent = isRegister ? 'Register' : 'Login';
  $('toggle').textContent = isRegister ? 'Have an account? Login' : 'Create account';
};
$('authBtn').onclick = async () => {
  try {
    const d = await api(isRegister ? '/api/register' : '/api/login', 'POST',
      { name: $('name').value, email: $('email').value, password: $('password').value });
    token = d.token; userName = d.name;
    localStorage.setItem('token', token); localStorage.setItem('name', userName);
    $('authErr').textContent = ''; show();
  } catch (e) { $('authErr').textContent = e.message; }
};
$('logout').onclick = logout;

async function loadTasks() { try { tasks = await api('/api/tasks'); render(); } catch {} }

function render() {
  const list = tasks.filter((t) => filter === 'all' || t.status === filter);
  $('list').innerHTML = list.length ? list.map((t) => `
    <div class="card task">
      <div class="row" style="justify-content:space-between"><h3>${esc(t.title)}</h3><span class="badge ${t.status}">${t.status}</span></div>
      <p>${esc(t.description || '')}</p>
      <div class="row">
        <select onchange="setStatus(${t.id},this.value)" style="width:auto">
          ${['todo', 'in-progress', 'done'].map((s) => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <button class="small ghost" onclick="edit(${t.id})">Edit</button>
        <button class="small danger" onclick="del(${t.id})">Delete</button>
      </div>
    </div>`).join('') : '<p style="text-align:center;color:var(--muted)">No tasks yet</p>';
}

$('addBtn').onclick = async () => {
  try {
    await api('/api/tasks', 'POST', { title: $('title').value.trim(), description: $('desc').value, status: $('status').value });
    $('title').value = $('desc').value = ''; $('taskErr').textContent = ''; loadTasks();
  } catch (e) { $('taskErr').textContent = e.message; }
};
window.setStatus = async (id, status) => { await api('/api/tasks/' + id, 'PUT', { status }); loadTasks(); };
window.del = async (id) => { if (confirm('Delete this task?')) { await api('/api/tasks/' + id, 'DELETE'); loadTasks(); } };
window.edit = async (id) => {
  const t = tasks.find((x) => x.id === id);
  const title = prompt('Title', t.title); if (!title) return;
  const description = prompt('Description', t.description);
  await api('/api/tasks/' + id, 'PUT', { title, description: description ?? t.description }); loadTasks();
};
$('filters').onclick = (e) => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  document.querySelectorAll('#filters button').forEach((b) => b.classList.toggle('active', b === e.target));
  render();
};
show();
</script>
</body>
</html>
